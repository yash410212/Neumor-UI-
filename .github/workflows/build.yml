name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q ModernLauncher_TecnoSpark8C_VivoY11_FINAL_98_PERCENT_POLISH.zip -d build-src
          echo "Extracted files:"
          find build-src -maxdepth 3 -type f | sort | head -200

      - name: Locate Gradle project
        run: |
          PROJECT_DIR=$(find build-src -type f -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew was not found in the uploaded ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          rm -rf /opt/gradle-8.13
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.13/bin/gradle --version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: /opt/gradle-8.13/bin/gradle assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neumor-UI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
